<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>LDRV-AcademiaFutbol</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <link rel="icon" href="assets/images/escudo.png">
    <link rel="apple-touch-icon" href="assets/images/escudo.png">

    <!-- Bootstrap local -->
    <link
        rel="stylesheet"
        href="css/bootstrap.min.css"
    >

    <!-- Estilos propios -->
    <link
        rel="stylesheet"
        href="css/app.css"
    >

</head>

<body>

    <main class="container-fluid min-vh-100">

        <!-- PANTALLA INICIAL -->

        <section
            id="home-screen"
            class="min-vh-100 d-flex flex-column justify-content-center align-items-center text-center p-3"
        >

            <!-- ESCUDOS -->

            <div
                class="d-flex align-items-center justify-content-center gap-3 gap-md-4 mb-4"
            >

                <img
                    src="assets/images/logo.png"
                    alt="Escudo CDF Javea"
                    class="img-fluid team-logo"
                >

                <span class="fs-3 fw-bold text-secondary">
                    ×
                </span>

                <img
                    src="assets/images/escudo.png"
                    alt="Escudo LDRV"
                    class="img-fluid team-logo"
                >
                
            </div>


            <!-- TÍTULO MÓVIL -->

            <h1 class="display-6 fw-bold d-block d-md-none">
                LDRV - Academia Futbol<br>
                CDF Javea
            </h1>


            <!-- TÍTULO TABLET / ORDENADOR -->

            <h1 class="display-6 fw-bold d-none d-md-block">
                LDRV - Academia Futbol - CDF Javea
            </h1>


            <!-- DESCRIPCIÓN -->

            <p class="text-secondary mb-4">
                Herramienta de trabajo para la academia de fútbol
            </p>


            <!-- BOTÓN -->

            <button
                id="enter-button"
                type="button"
                class="btn btn-primary btn-lg px-5"
            >
                ENTRAR
            </button>

        </section>


        <!-- MENÚ -->

        <section
            id="menu-screen"
            class="container py-4 d-none"
        >

            <header class="text-center mb-4">

                <h1 class="h2 fw-bold">
                    Menú
                </h1>

            </header>

            <div id="app-content"></div>

        </section>

        <!-- VERSIÓN (visible siempre, encima de cualquier pantalla) -->
        <span
            class="app-version position-fixed bottom-0 end-0 m-2 text-secondary small"
        ></span>

    </main>


    <!-- Bootstrap local -->
    <script src="js/bootstrap.bundle.min.js"></script>

    <!-- Motor de menú -->
    <script src="js/menu-engine.js"></script>

    <!-- Aplicación -->
    <script src="js/app.js"></script>

</body>

</html>
