<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LDRV-AcademiaFutbol</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .logo {
            width: min(220px, 55vw);
            height: min(220px, 55vw);
            object-fit: contain;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            text-align: center;
            font-size: clamp(1.8rem, 6vw, 3rem);
        }

        p {
            margin: 12px 0 32px;
            text-align: center;
            font-size: 1rem;
            color: #666;
        }

        .enter-button {
            border: none;
            border-radius: 12px;
            padding: 16px 42px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .enter-button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

    <main class="app">

        <!-- Sustituiremos esta imagen por el escudo -->
        <img
            class="logo"
            src="assets/images/escudo.png"
            alt="Escudo LDRV-AcademiaFutbol"
        >

        <h1>LDRV-AcademiaFutbol</h1>

        <p>
            Herramienta de trabajo para la academia de fútbol
        </p>

        <button class="enter-button" type="button">
            ENTRAR
        </button>

    </main>

</body>
</html>
