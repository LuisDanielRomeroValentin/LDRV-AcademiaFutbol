<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>LDRV-AcademiaFutbol</title>

    <!-- Bootstrap local -->
    <link
        rel="stylesheet"
        href="css/bootstrap.min.css"
    >

    <!-- Estilos propios -->
    <link
        rel="stylesheet"
        href="css/app.css"
    >

</head>

<body>

    <main class="container-fluid min-vh-100">

        <!-- PANTALLA INICIAL -->

        <section
            id="home-screen"
            class="min-vh-100 d-flex flex-column justify-content-center align-items-center text-center p-3"
        >

            <img
                class="logo mb-4"
                src="assets/images/escudo.png"
                alt="Escudo LDRV-AcademiaFutbol"
            >

            <h1 class="display-5 fw-bold">
                LDRV-AcademiaFutbol
            </h1>

            <p class="text-secondary mb-4">
                Herramienta de trabajo para la academia de fútbol
            </p>

            <button
                id="enter-button"
                type="button"
                class="btn btn-primary btn-lg px-5"
            >
                ENTRAR
            </button>

        </section>


        <!-- MENÚ -->

        <section
            id="menu-screen"
            class="container py-4 d-none"
        >

            <header class="text-center mb-4">

                <h1 class="h2 fw-bold">
                    Menú
                </h1>

            </header>

            <div id="app-content"></div>

        </section>

    </main>


    <!-- Bootstrap local -->
    <script src="js/bootstrap.bundle.min.js"></script>

    <!-- Motor de menú -->
    <script src="js/menu-engine.js"></script>

    <!-- Aplicación -->
    <script src="js/app.js"></script>

</body>

</html>
